name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core-and-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y clang-tidy-18
      - run: pip install -r backend/requirements.txt clang-format==18.1.8
      - run: cmake -S . -B out -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_CXX_CLANG_TIDY=clang-tidy-18
      - run: cmake --build out --parallel 2
      - run: ctest --test-dir out --output-on-failure
      - run: find source tests platform/android/jni -type f \( -name '*.hpp' -o -name '*.cpp' \) -print0 | xargs -0 clang-format --dry-run --Werror
      - run: python -m pytest -q
      - run: ruff check backend tests/test_backend.py && ruff format --check backend tests/test_backend.py
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - run: bash platform/android/gradlew -p platform/android assembleDebug lintDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: student-memory-debug
          path: platform/android/app/build/outputs/apk/debug/app-debug.apk

  android-smoke:
    # Lightweight smoke test: reuse the APK built by the `android` job, install it on a
    # single emulator, launch PackBack and confirm it does not crash on startup.
    # Runs only on pull requests and on the main branch; skipped for pushes to other
    # branches (e.g. kang) to keep those pushes fast.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: android
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download the APK built by CI
        uses: actions/download-artifact@v4
        with:
          name: student-memory-debug
          path: apk

      - name: Launch emulator and smoke-test the APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Matches the project's compileSdk/targetSdk 35; x86_64 matches the ABI the
          # native library ships (abiFilters arm64-v8a, x86_64) so JNI loads on CI.
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh
